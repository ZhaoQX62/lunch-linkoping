# Refreshes menus.json every weekday morning and publishes the app to GitHub Pages.
# Enable in the repo: Settings -> Pages -> Source: "GitHub Actions".
name: Update lunch menus

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 07:30 UTC = 08:30/09:30 Swedish time, Mon–Fri
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch-menus.mjs
      - name: Commit menus.json
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menus.json
          git diff --cached --quiet || git commit -m "Update lunch menus"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
