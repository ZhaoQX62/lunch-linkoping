# Checks lunch menus on weekdays and publishes the app to GitHub Pages.
# Enable in the repo: Settings -> Pages -> Source: "GitHub Actions".
#
# fetch-menus.mjs only refetches menus that aren't from the current week yet, so most
# checks do nothing (no commit, no deploy). They catch restaurants that publish late
# (often Monday after 10:00) and sites that were down at an earlier check.
#
# Why hourly: GitHub starts scheduled runs late on small repos (observed 7.5–8.5 hours in
# Nov 2026), and can skip some. A check every hour means that whatever the delay is, some
# check lands during the morning. Each check takes ~20 s; free for a public repo.
name: Update lunch menus

on:
  schedule:
    # Every hour at :17 (off the busy :00/:30 slots), Monday 00:17 UTC to Friday 23:17 UTC.
    - cron: '17 * * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refetch all menus, even ones already from this week'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Never run two updates at once (they would both try to push menus.json).
concurrency:
  group: update-menus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch-menus.mjs ${{ inputs.force && '--force' || '' }}
      - name: Commit menus.json
        id: commit
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menus.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update lunch menus"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Scheduled checks that changed nothing skip the deploy; pushes and manual runs always deploy.
      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
